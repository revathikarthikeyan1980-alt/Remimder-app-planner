<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminder App Planner</title>
    <link rel="stylesheet" href="style.css">
   <link rel="icon" type="image/jpeg" href="WhatsApp image 2026-10-24 at 9.48.46 AM.jpeg">
</head>
<body>

    <div class="container">
        <h1>🔔 Reminder App Planner</h1>
        <p>Never forget your important tasks!</p>

        <input type="text" id="task" placeholder="Enter your task">

        <label for="date">Reminder Date:</label>
        <input type="date" id="date">

        <label for="time">Reminder Time:</label>
        <input type="time" id="time">

        <button onclick="addReminder()">Add Reminder</button>

        <h2>My Reminders</h2>
        <ul id="reminderList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
